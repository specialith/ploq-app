name: Bug report
description: Something in Ploq doesn't work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a score with parts
        2. Press Share
        3. ...
    validations:
      required: true
  - type: dropdown
    id: shared
    attributes:
      label: Was the score shared?
      options:
        - "Yes, others were in it"
        - "Yes, only me"
        - "No"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ploq version
      description: Help > About Ploq.
      placeholder: "1.0.5"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11"
  - type: textarea
    id: logs
    attributes:
      label: Log file
      description: Attach the log from that session (%LOCALAPPDATA%\Ploq\Ploq\logs). Check it for anything private first.
